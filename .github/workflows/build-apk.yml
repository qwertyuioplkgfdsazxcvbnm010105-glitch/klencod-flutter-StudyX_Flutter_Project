name: Build StudyX APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # توليد مجلد android الرسمي (غير موجود في الملف المضغوط عمدًا)
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.studyx --project-name studyx .

      # إضافة صلاحيات المنبهات + المستقبِلات + تفعيل desugaring
      - name: Patch Android files
        run: python3 tools/patch_android.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: StudyX-apk
          path: build/app/outputs/flutter-apk/app-release.apk
